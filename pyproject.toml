[project]
name = "craftpass"
version = "0.1.0"
description = "Self-hosted single sign-on: Caddy forward-auth gateway + OpenID Connect provider for the LabCraft stack"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LabCraft-dev" }]
keywords = ["sso", "oidc", "forward-auth", "fastapi", "caddy", "jellyfin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
    "argon2-cffi>=25.1,<26",
    "pyotp>=2.10,<3",
    "qrcode>=8.2,<9",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32,<0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",
]

[project.urls]
Homepage = "https://github.com/LabCraft-dev/CraftPass"
Issues = "https://github.com/LabCraft-dev/CraftPass/issues"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["craftpass*"]

[tool.setuptools.package-data]
craftpass = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplification
    "S",    # bandit-style security
    "RUF",  # ruff-specific
    "PL",   # pylint
]
ignore = [
    "B008",     # Depends()/Form() in defaults is the documented FastAPI pattern
    "PLR0913",  # FastAPI handlers legitimately take several form fields
    "PLR0911",  # route guards return early by design
    "PLR0917",  # FastAPI keyword-only form parameters read better positional here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # asserts are the point of tests
    "S105",    # fixture passwords are not secrets
    "S106",    # ditto for arguments
    "PLR2004", # HTTP status codes as literals are the point of tests
    "PLC0415", # focused local imports keep test setup visible
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
