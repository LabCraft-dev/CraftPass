name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]   # releases: v0.1.0 etc. -> semver tags + latest on Docker Hub
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" --quiet
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" --quiet
      - run: pytest -ra

  caddyfile:
    name: Caddyfile validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Caddy
        run: |
          set -eux
          tag="$(curl -fsSL -o /dev/null -w '%{url_effective}' -L \
            https://github.com/caddyserver/caddy/releases/latest | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$')"
          curl -fsSL \
            "https://github.com/caddyserver/caddy/releases/latest/download/caddy_${tag#v}_linux_amd64.tar.gz" \
            -o caddy.tgz
          tar xzf caddy.tgz caddy
          chmod +x caddy
      - name: Validate
        run: ./caddy validate --config deploy/Caddyfile --adapter caddyfile

  image:
    name: Image builds (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/arm64   # the production target (arm VM)
            platform: linux/arm64
          - arch: linux/amd64   # keep dev machines covered too
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, test, caddyfile, image]
    # Runs on main (edge tag) and v* tags (semver + latest). Skips
    # cleanly on PRs and until the DOCKERHUB_* repo secrets are set.
    if: >-
      github.event_name != 'pull_request' &&
      secrets.DOCKERHUB_USERNAME != '' &&
      secrets.DOCKERHUB_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/craftpass
          flavor: |
            latest=false
          tags: |
            # v1.2.3 -> 1.2.3, 1.2, 1 + latest (major-only skipped while 0.x)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # every push to main -> edge
            type=edge,branch=main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
