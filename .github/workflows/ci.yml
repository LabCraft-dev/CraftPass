name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]   # releases: v0.1.0 etc. -> semver tags + latest on Docker Hub
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" --quiet
      - run: ruff check .
      - run: ruff format --check .
      - name: Lint workflow files (actionlint)
        run: |
          set -eux
          tag="$(curl -fsSL -o /dev/null -w '%{url_effective}' -L \
            https://github.com/rhysd/actionlint/releases/latest | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$')"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/${tag}/actionlint_${tag#v}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" --quiet
      - run: pytest -ra

  caddyfile:
    name: Caddyfile validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Caddy
        run: |
          set -eux
          tag="$(curl -fsSL -o /dev/null -w '%{url_effective}' -L \
            https://github.com/caddyserver/caddy/releases/latest | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$')"
          curl -fsSL \
            "https://github.com/caddyserver/caddy/releases/latest/download/caddy_${tag#v}_linux_amd64.tar.gz" \
            -o caddy.tgz
          tar xzf caddy.tgz caddy
          chmod +x caddy
      - name: Validate
        run: ./caddy validate --config deploy/Caddyfile --adapter caddyfile

  image:
    name: Image builds (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/arm64   # the production target (arm VM)
            platform: linux/arm64
          - arch: linux/amd64   # keep dev machines covered too
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, test, caddyfile, image]
    # Runs on main (edge tag) and v* tags (semver + latest); never on
    # PRs. Docker Hub credentials are checked in-step because the
    # secrets context is not available in job-level if conditions.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: git describe -> version
      - name: Check Docker Hub credentials
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are not set; skipping image push."
          fi
      - name: Derive package version from git
        id: ver
        run: |
          set -eux
          desc="$(git describe --tags --match 'v*' 2>/dev/null || true)"
          if [ -n "$desc" ]; then
            # v1.2.3 -> 1.2.3 | v1.2.3-5-gabcdef -> 1.2.3.dev5+gabcdef (PEP 440)
            ver="$(printf '%s' "$desc" | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/.dev\1+g\2/')"
          else
            ver="0.1.0.dev0+g${GITHUB_SHA:0:7}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "baked-in version: $ver"
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'
      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        if: steps.creds.outputs.ok == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/craftpass
          flavor: |
            latest=false
          tags: |
            # v1.2.3 -> 1.2.3, 1.2, 1 + latest (major-only skipped while 0.x)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # every push to main -> edge
            type=edge,branch=main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build & push (amd64 + arm64)
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
