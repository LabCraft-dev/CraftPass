{% extends "base.html" %}
{% block title %}Server error · CraftPass{% endblock %}

{% block body %}
<main class="bg-dots flex flex-1 items-center justify-center px-4 py-12">
  <div class="card w-full max-w-md p-8 text-center">
    <p class="font-mono text-4xl font-semibold text-red-700">500</p>
    <h1 class="mt-3 text-xl font-semibold tracking-tight">Something broke</h1>
    <p class="mt-3 text-sm text-zinc-600">
      The error was logged. Check <span class="font-mono text-xs">docker logs craftpass</span>
      for details, then try again.
    </p>
    <div class="mt-6 flex justify-center gap-3">
      <a class="btn-primary" href="/">Start over</a>
    </div>
  </div>
</main>
{% endblock %}
